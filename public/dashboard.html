<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundora Agency AI · Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        :root {
          --bg-primary: #0d1117;
          --bg-secondary: #161b22;
          --bg-tertiary: #21262d;
          --bg-card: #1c2128;
          --border: #30363d;
          --text-primary: #e6edf3;
          --text-secondary: #8b949e;
          --accent-gold: #d4af37;
          --accent-blue: #58a6ff;
          --accent-green: #3fb950;
          --accent-red: #f85149;
          --accent-purple: #a371f7;
          --glass-bg: rgba(22, 27, 34, 0.8);
          --glass-border: rgba(48, 54, 61, 0.6);
        }
        
        body { 
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            display:flex; 
            height:100vh;
            overflow:hidden;
        }
        
        #panel-izq { 
            width:55%; 
            display:flex; 
            flex-direction:column; 
            border-right:1px solid var(--border);
            background: var(--bg-secondary);
        }
        #panel-der { 
            width:45%; 
            display:flex; 
            flex-direction:column; 
            background: var(--bg-primary);
        }
        
        .header { 
            padding:14px 20px; 
            background: var(--bg-secondary); 
            border-bottom:1px solid var(--border); 
            font-weight:600; 
            font-size:13px; 
            letter-spacing:0.5px; 
            color: var(--text-primary);
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }
        
        #terminal-container { 
            flex:1; 
            padding:8px; 
            background: #0d1117;
            font-family: 'JetBrains Mono', monospace;
        }
        
        #chat-wrapper { display:flex; flex:1; overflow:hidden; }
        
        #chat-sidebar { 
            width:240px; 
            background: var(--bg-secondary); 
            border-right:1px solid var(--border); 
            overflow-y:auto; 
            display:none; 
            flex-shrink:0;
            backdrop-filter: blur(10px);
        }
        #chat-sidebar.open { display:block; }
        #chat-sidebar .sidebar-header { 
            padding:14px; 
            font-weight:600; 
            border-bottom:1px solid var(--border); 
            display:flex; 
            justify-content:space-between; 
            align-items:center;
            color: var(--text-primary);
        }
        #chat-sidebar .sidebar-item { 
            padding:10px 14px; 
            cursor:pointer; 
            border-bottom:1px solid var(--border); 
            display:flex; 
            justify-content:space-between; 
            align-items:center;
            transition: background 0.2s;
        }
        #chat-sidebar .sidebar-item:hover { background: var(--bg-tertiary); }
        #chat-sidebar .sidebar-item .agent-name { flex:1; font-size:13px; color: var(--text-secondary); }
        #chat-sidebar .sidebar-item .delete-btn { 
            background:transparent; 
            color: var(--accent-red); 
            border:none; 
            cursor:pointer; 
            font-size:12px; 
            padding:2px 6px;
            opacity:0.6;
            transition: opacity 0.2s;
        }
        #chat-sidebar .sidebar-item:hover .delete-btn { opacity:1; }
        
        #chat-container { 
            flex:1; 
            display:flex; 
            flex-direction:column;
            background: var(--bg-primary);
        }
        
        #chat-messages { 
            flex:1; 
            overflow-y:auto; 
            padding:20px; 
            max-width:800px; 
            margin:0 auto; 
            width:100%;
        }
        
        .msg { 
            margin-bottom:12px; 
            padding:12px 16px; 
            border-radius:16px; 
            max-width:80%; 
            word-wrap:break-word;
            position:relative;
            font-size:13px;
            line-height:1.5;
            backdrop-filter: blur(5px);
        }
        .msg.user { 
            background: var(--glass-bg);
            border:1px solid var(--accent-gold);
            color: var(--text-primary); 
            margin-left:auto; 
            text-align:right;
            border-bottom-right-radius:4px;
        }
        .msg.agent { 
            background: var(--glass-bg);
            border:1px solid var(--border);
            color: var(--text-secondary); 
            margin-right:auto; 
            text-align:left; 
            border-left:3px solid var(--accent-blue);
            border-bottom-left-radius:4px;
        }
        .msg.agent .copy-btn { 
            position:absolute; 
            top:6px; 
            right:6px; 
            background: var(--bg-tertiary); 
            color: var(--text-secondary); 
            border:none; 
            border-radius:6px; 
            padding:2px 8px; 
            font-size:10px; 
            cursor:pointer; 
            opacity:0; 
            transition:opacity 0.2s; 
        }
        .msg.agent:hover .copy-btn { opacity:1; }
        .msg.agent .copy-btn:hover { background: var(--border); color: var(--text-primary); }
        
        #chat-input-area { 
            display:flex; 
            padding:16px 20px; 
            background: var(--glass-bg);
            border-top:1px solid var(--glass-border); 
            flex-wrap:wrap; 
            gap:8px;
            backdrop-filter: blur(10px);
        }
        #chat-input-area select, #chat-input-area input { 
            background: var(--bg-tertiary); 
            color: var(--text-primary); 
            border:1px solid var(--border); 
            border-radius:10px; 
            padding:8px 14px; 
            outline:none; 
            font-size:13px;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.2s;
        }
        #chat-input-area select:focus, #chat-input-area input:focus {
            border-color: var(--accent-blue);
        }
        #chat-input-area input { flex:1; min-width:120px; }
        #chat-input-area button { 
            color:#fff; 
            border:none; 
            border-radius:10px; 
            padding:8px 16px; 
            font-weight:600; 
            cursor:pointer; 
            font-size:12px; 
            transition: all 0.2s; 
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing:0.5px;
        }
        #chat-input-area button:hover { transform:translateY(-1px); }
        .btn-gold { background: var(--accent-gold); color:#000; }
        .btn-gold:hover { background: #c19b2e; }
        .btn-blue { background: var(--accent-blue); color:#000; }
        .btn-blue:hover { background: #4a8ed6; }
        .btn-purple { background: var(--accent-purple); color:#fff; }
        .btn-purple:hover { background: #8b5cf6; }
        .btn-red { background: var(--accent-red); color:#fff; }
        .btn-red:hover { background: #d63e33; }
        .btn-green { background: var(--accent-green); color:#000; }
        .btn-green:hover { background: #2ea043; }
        
        #toggle-sidebar { 
            background: var(--bg-tertiary); 
            color: var(--text-secondary); 
            border:1px solid var(--border); 
            border-radius:8px; 
            padding:4px 10px; 
            font-size:11px; 
            cursor:pointer;
            transition: all 0.2s;
        }
        #toggle-sidebar:hover { background: var(--border); color: var(--text-primary); }
    </style>
</head>
<body>
    <div id="panel-izq">
        <div class="header">🖥️ Terminal (Xterm.js)</div>
        <div id="terminal-container"></div>
    </div>
    <div id="panel-der">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
  <span>🤖 Chat con Agentes</span>
  <div style="display:flex;gap:6px;">
    <button onclick="clearChat()" class="btn-blue" style="border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">🗑️ Limpiar</button>
    <button onclick="downloadChat()" class="btn-blue" style="border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">📥 Descargar</button>
    <button onclick="loadHistory()" class="btn-blue" style="border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">📜 Historial</button>
  </div>
</div>
        <div id="chat-container">
            <div id="chat-messages">
                <div class="msg agent"><strong>Fundora AI:</strong> Dashboard conectado. Selecciona un agente y escribe tu mensaje.</div>
            </div>
            <div id="chat-input-area" style="flex-wrap:wrap;">
                <button onclick="generarImagen()" class="btn-gold" style="border:none;border-radius:8px;padding:6px 12px;font-weight:bold;cursor:pointer;margin-right:8px;">🖼️ Imagen</button>
                <button onclick="generarVideo()" class="btn-purple" style="border:none;border-radius:8px;padding:6px 12px;font-weight:bold;cursor:pointer;margin-right:8px;">🎬 Video</button>
                <button onclick="generarPDF()" class="btn-red" style="border:none;border-radius:8px;padding:6px 12px;font-weight:bold;cursor:pointer;margin-right:8px;">📄 PDF</button>
                <select id="agente-select">
                    <option value="general">General</option>
                    <option value="ceo">CEO</option>
                    <option value="programador">Programador</option>
                    <option value="analista">Analista</option>
                    <option value="abogado">Abogado</option>
                    <option value="director">Director</option>
                    <option value="psicologo">Psicólogo</option>
                    <option value="rastreador">Rastreador</option>
                </select>
                <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." />
                <button id="chat-send">Enviar</button>
            </div>
          </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.9.0/lib/addon-fit.min.js"></script>
    <script>
        // Terminal con WebSocket real
        const term = new Terminal({ theme: { background: '#0a0c10', foreground: '#e0e0e0' }, fontSize: 13, fontFamily: 'monospace' });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();
        
        let ws;
        let wsReconnectAttempts = 0;

        function connectWebSocket() {
            ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/terminal');
            ws.onmessage = (e) => { term.write(e.data); };
            ws.onopen = () => {
                wsReconnectAttempts = 0;
                term.writeln('🟢 Conectado al servidor.');
            };
            ws.onclose = () => {
                term.writeln('🔴 Conexión perdida. Reconectando en ' + (Math.min(wsReconnectAttempts + 1, 5) * 2) + 's...');
                setTimeout(connectWebSocket, Math.min(++wsReconnectAttempts, 5) * 2000);
            };
        }
        connectWebSocket();
        
        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });

        // Chat conectado con agentes reales de Fundora AI
        const messagesDiv = document.getElementById('chat-messages');
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send');
        const agentSelect = document.getElementById('agente-select');

        // Mapeo de nombres amigables
        const agentNames = {
            general: 'Fundora AI',
            ceo: 'CEO Fundora',
            programador: 'Fundora DEV',
            analista: 'Fundora SPORTS',
            abogado: 'Fundora LEX',
            director: 'Fundora VISION',
            psicologo: 'Fundora MIND',
            rastreador: 'Rastreador'
        };

        let typingIndicator = null;

        function showTyping() {
            if (!typingIndicator) {
                typingIndicator = document.createElement('div');
                typingIndicator.className = 'msg agent';
                typingIndicator.innerHTML = '<strong>' + (agentNames[agentSelect.value] || agentSelect.value) + ':</strong> <em>escribiendo...</em>';
                messagesDiv.appendChild(typingIndicator);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function hideTyping() {
            if (typingIndicator) {
                typingIndicator.remove();
                typingIndicator = null;
            }
        }

        function addMessage(text, role) {
            hideTyping();
            const div = document.createElement('div');
            div.className = 'msg ' + (role === 'user' ? 'user' : 'agent');
            const displayName = role === 'user' ? 'Tú' : (agentNames[agentSelect.value] || agentSelect.value);
            let contenido = text.replace(/\n/g, '<br>');
            // Detectar si la respuesta contiene una imagen en base64 o URL
            if (text.startsWith('data:image/') || text.includes('data:image/png;base64,')) {
                contenido += '<br><img src="' + text.substring(0, 500) + '" style="max-width:300px;border-radius:8px;margin-top:8px;" onerror="this.style.display=\'none\'"/>';
            }
            // Si el contenido es una imagen (tag img), mostrarla directamente
            if (text.startsWith('<img ')) {
                div.innerHTML = '<strong>' + displayName + ':</strong> ' + text;
            } else {
                let contenido = text.replace(/\n/g, '<br>');
                if (text.startsWith('data:image/') || text.includes('data:image/png;base64,')) {
                    contenido += '<br><img src="' + text.substring(0, 500) + '" style="max-width:300px;border-radius:8px;margin-top:8px;" onerror="this.style.display=\'none\'"/>';
                }
                div.innerHTML = '<strong>' + displayName + ':</strong> ' + contenido;
            }
            // Añadir botón de copiar en mensajes del agente
            if (role === 'agent') {
                var copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '📋';
                copyBtn.onclick = function() { copiarTexto(text.replace(/<br>/g, '\n').replace(/<[^>]*>/g, ''), copyBtn); };
                div.appendChild(copyBtn);
            }
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const msg = input.value.trim();
            if (!msg) return;
            const agente = agentSelect.value;
            addMessage(msg, 'user');
            input.value = '';
            sendBtn.disabled = true;
            showTyping();
            try {
                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mensaje: msg, agente, sessionId: 'dashboard-' + agente })
                });
                const text = await resp.text();
                let data;
                try {
                    data = JSON.parse(text.replace(/[\x00-\x1F\x7F]/g, ''));
                } catch(e) {
                    addMessage('Error al procesar la respuesta del servidor.', 'agent');
                    sendBtn.disabled = false;
                    return;
                }
                const respuesta = (data.respuesta || 'Sin respuesta').replace(/\n/g, '<br>');
                addMessage(respuesta, 'agent');
            } catch(e) {
                addMessage('Error de conexión con el servidor.', 'agent');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function copiarTexto(texto, btn) {
    navigator.clipboard.writeText(texto).then(function() {
        btn.textContent = '✅';
        setTimeout(function() { btn.textContent = '📋'; }, 1500);
    }).catch(function() {
        btn.textContent = '❌';
    });
}

function toggleSidebar() {
    var sidebar = document.getElementById('chat-sidebar');
    sidebar.classList.toggle('open');
    if (sidebar.classList.contains('open')) {
        buildSidebar();
    }
}
function closeSidebar() {
    document.getElementById('chat-sidebar').classList.remove('open');
}
function buildSidebar() {
    var list = document.getElementById('sidebar-list');
    list.innerHTML = '';
    for (var id in agentNames) {
        var item = document.createElement('div');
        item.className = 'sidebar-item';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'agent-name';
        nameSpan.textContent = agentNames[id];
        nameSpan.onclick = function(agentId) { return function() { loadSession(agentId); }; }(id);
        var delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '🗑️';
        delBtn.onclick = function(agentId) { return function(e) { e.stopPropagation(); deleteSession(agentId); }; }(id);
        item.appendChild(nameSpan);
        item.appendChild(delBtn);
        list.appendChild(item);
    }
}
function loadSession(agentId) {
    document.getElementById('agente-select').value = agentId;
    loadHistory();
    closeSidebar();
}
function deleteSession(agentId) {
    if (!confirm('¿Borrar historial de ' + agentNames[agentId] + '?')) return;
    fetch('/sesion/dashboard-' + agentId, { method: 'DELETE' }).then(function() {
        if (agentId === document.getElementById('agente-select').value) {
            document.getElementById('chat-messages').innerHTML = '<div class="msg agent"><strong>Fundora AI:</strong> Historial borrado.</div>';
        }
        alert('Historial eliminado.');
    }).catch(function() {
        alert('Error al borrar. Se limpiará localmente.');
    });
}
function clearChat() {
  document.getElementById('chat-messages').innerHTML = '<div class="msg agent"><strong>Fundora AI:</strong> Chat limpiado.</div>';
}

function downloadChat() {
  const chat = document.getElementById('chat-messages').innerText;
  const blob = new Blob([chat], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fundora-chat-' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
}

async function loadHistory() {
  const agente = document.getElementById('agente-select').value;
  try {
    const resp = await fetch('/memoria/' + agente + '?sessionId=dashboard-' + agente);
    const data = await resp.json();
    const mensajesDiv = document.getElementById('chat-messages');
    mensajesDiv.innerHTML = '<div class="msg agent"><strong>Fundora AI:</strong> Historial cargado.</div>';
    if (data.memoria) {
      data.memoria.forEach(item => {
        const div = document.createElement('div');
        div.className = 'msg ' + (item.tipo === 'chat' && item.contenido.startsWith('USUARIO:') ? 'user' : 'agent');
        const role = item.contenido.startsWith('USUARIO:') ? 'Tú' : agente;
        const text = item.contenido.replace(/^(USUARIO|AGENTE):\s*/, '');
        div.innerHTML = '<strong>' + role + ':</strong> ' + text;
        mensajesDiv.appendChild(div);
      });
    }
    mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
  } catch(e) {
    alert('Error al cargar historial');
  }
}

async function generarImagen() {
            const msg = input.value.trim();
            if (!msg) {
                alert('Escribe un prompt para la imagen.');
                return;
            }
            const prompt = msg;
            addMessage('🖼️ Generando imagen para: ' + prompt, 'user');
            input.value = '';
            sendBtn.disabled = true;
            showTyping();
            try {
                const resp = await fetch('/chat/imagen', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt })
                });
                const data = await resp.json();
                hideTyping();
                if (data.status === 'ok' && data.imagen) {
                    addMessage('<img src="' + data.imagen + '" style="max-width:100%;border-radius:8px;"/>', 'agent');
                } else {
                    addMessage('❌ Error al generar imagen: ' + (data.mensaje || data.error || 'Desconocido'), 'agent');
                }
            } catch(e) {
                hideTyping();
                addMessage('Error de conexión al generar imagen.', 'agent');
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function generarVideo() {
            const msg = input.value.trim();
            if (!msg) { alert('Escribe un prompt para el video.'); return; }
            addMessage('🎬 Generando video para: ' + msg, 'user');
            input.value = '';
            sendBtn.disabled = true;
            showTyping();
            try {
                const resp = await fetch('/generar/video', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: msg })
                });
                const data = await resp.json();
                hideTyping();
                if (data.status === 'ok' && data.video) {
                    addMessage('✅ Video generado (resolución: ' + data.resolucion + ', fps: ' + data.fps + '). Descargar: <a href="' + data.video + '" download="video.mp4">enlace</a>', 'agent');
                } else {
                    addMessage('❌ Error: ' + (data.mensaje || 'Desconocido'), 'agent');
                }
            } catch(e) {
                hideTyping();
                addMessage('Error de conexión al generar video.', 'agent');
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function generarPDF() {
            const msg = input.value.trim();
            if (!msg) { alert('Escribe el contenido para el PDF.'); return; }
            addMessage('📄 Generando PDF...', 'user');
            input.value = '';
            sendBtn.disabled = true;
            showTyping();
            try {
                const resp = await fetch('/generar/pdf', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ titulo: 'Documento Fundora AI', contenido: msg })
                });
                const data = await resp.json();
                hideTyping();
                if (data.status === 'ok' && data.pdf) {
                    addMessage('✅ PDF generado. <a href="' + data.pdf + '" download="' + data.nombre + '">Descargar PDF</a>', 'agent');
                } else {
                    addMessage('❌ Error al generar PDF.', 'agent');
                }
            } catch(e) {
                hideTyping();
                addMessage('Error de conexión al generar PDF.', 'agent');
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
