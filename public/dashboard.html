<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundora Agency AI · Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background:#0a0c10; color:#e0e0e0; display:flex; height:100vh; }
        #panel-izq { width:55%; display:flex; flex-direction:column; border-right:2px solid #1e293b; }
        #panel-der { width:45%; display:flex; flex-direction:column; }
        .header { padding:12px 16px; background:#131720; border-bottom:1px solid #1e293b; font-weight:600; font-size:14px; letter-spacing:0.3px; }
        #terminal-container { flex:1; padding:4px; background:#0a0c10; }
        #chat-container { flex:1; display:flex; flex-direction:column; }
        #chat-messages { flex:1; overflow-y:auto; padding:12px; }
        #chat-input-area { display:flex; padding:10px; background:#131720; border-top:1px solid #1e293b; }
        #chat-input-area select { background:#1e293b; color:#e0e0e0; border:1px solid #334155; border-radius:8px; padding:6px 10px; margin-right:8px; outline:none; }
        #chat-input-area input { flex:1; background:#1e293b; color:#e0e0e0; border:1px solid #334155; border-radius:8px; padding:6px 12px; outline:none; }
        #chat-input-area button { background:#d4af37; color:#000; border:none; border-radius:8px; padding:6px 16px; margin-left:8px; font-weight:bold; cursor:pointer; }
        .msg { margin-bottom:8px; }
        .msg.user { text-align:right; color:#d4af37; }
        .msg.agent { text-align:left; color:#a5b4fc; }
    </style>
</head>
<body>
    <div id="panel-izq">
        <div class="header">🖥️ Terminal (Xterm.js)</div>
        <div id="terminal-container"></div>
    </div>
    <div id="panel-der">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
  <span>🤖 Chat con Agentes</span>
  <div style="display:flex;gap:6px;">
    <button onclick="clearChat()" style="background:#374151;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">🗑️ Limpiar</button>
    <button onclick="downloadChat()" style="background:#374151;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">📥 Descargar</button>
    <button onclick="loadHistory()" style="background:#374151;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">📜 Historial</button>
  </div>
</div>
        <div id="chat-container">
            <div id="chat-messages">
                <div class="msg agent"><strong>Fundora AI:</strong> Dashboard conectado. Selecciona un agente y escribe tu mensaje.</div>
            </div>
            <div id="chat-input-area">
                <select id="agente-select">
                    <option value="general">General</option>
                    <option value="ceo">CEO</option>
                    <option value="programador">Programador</option>
                    <option value="analista">Analista</option>
                    <option value="abogado">Abogado</option>
                    <option value="director">Director</option>
                    <option value="psicologo">Psicólogo</option>
                    <option value="rastreador">Rastreador</option>
                </select>
                <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." />
                <button id="chat-send">Enviar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.9.0/lib/addon-fit.min.js"></script>
    <script>
        // Terminal con WebSocket real
        const term = new Terminal({ theme: { background: '#0a0c10', foreground: '#e0e0e0' }, fontSize: 13, fontFamily: 'monospace' });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();
        
        let ws;
        let wsReconnectAttempts = 0;

        function connectWebSocket() {
            ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/terminal');
            ws.onmessage = (e) => { term.write(e.data); };
            ws.onopen = () => {
                wsReconnectAttempts = 0;
                term.writeln('🟢 Conectado al servidor.');
            };
            ws.onclose = () => {
                term.writeln('🔴 Conexión perdida. Reconectando en ' + (Math.min(wsReconnectAttempts + 1, 5) * 2) + 's...');
                setTimeout(connectWebSocket, Math.min(++wsReconnectAttempts, 5) * 2000);
            };
        }
        connectWebSocket();
        
        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });

        // Chat conectado con agentes reales de Fundora AI
        const messagesDiv = document.getElementById('chat-messages');
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send');
        const agentSelect = document.getElementById('agente-select');

        // Mapeo de nombres amigables
        const agentNames = {
            general: 'Fundora AI',
            ceo: 'CEO Fundora',
            programador: 'Fundora DEV',
            analista: 'Fundora SPORTS',
            abogado: 'Fundora LEX',
            director: 'Fundora VISION',
            psicologo: 'Fundora MIND',
            rastreador: 'Rastreador'
        };

        let typingIndicator = null;

        function showTyping() {
            if (!typingIndicator) {
                typingIndicator = document.createElement('div');
                typingIndicator.className = 'msg agent';
                typingIndicator.innerHTML = '<strong>' + (agentNames[agentSelect.value] || agentSelect.value) + ':</strong> <em>escribiendo...</em>';
                messagesDiv.appendChild(typingIndicator);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function hideTyping() {
            if (typingIndicator) {
                typingIndicator.remove();
                typingIndicator = null;
            }
        }

        function addMessage(text, role) {
            hideTyping();
            const div = document.createElement('div');
            div.className = 'msg ' + (role === 'user' ? 'user' : 'agent');
            const displayName = role === 'user' ? 'Tú' : (agentNames[agentSelect.value] || agentSelect.value);
            let contenido = text.replace(/\n/g, '<br>');
            // Detectar si la respuesta contiene una imagen en base64 o URL
            if (text.startsWith('data:image/') || text.includes('data:image/png;base64,')) {
                contenido += '<br><img src="' + text.substring(0, 500) + '" style="max-width:300px;border-radius:8px;margin-top:8px;" onerror="this.style.display=\'none\'"/>';
            }
            div.innerHTML = '<strong>' + displayName + ':</strong> ' + contenido;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const msg = input.value.trim();
            if (!msg) return;
            const agente = agentSelect.value;
            addMessage(msg, 'user');
            input.value = '';
            sendBtn.disabled = true;
            showTyping();
            try {
                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mensaje: msg, agente, sessionId: 'dashboard-' + agente })
                });
                const text = await resp.text();
                let data;
                try {
                    data = JSON.parse(text.replace(/[\x00-\x1F\x7F]/g, ''));
                } catch(e) {
                    addMessage('Error al procesar la respuesta del servidor.', 'agent');
                    sendBtn.disabled = false;
                    return;
                }
                const respuesta = (data.respuesta || 'Sin respuesta').replace(/\n/g, '<br>');
                addMessage(respuesta, 'agent');
            } catch(e) {
                addMessage('Error de conexión con el servidor.', 'agent');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function clearChat() {
  document.getElementById('chat-messages').innerHTML = '<div class="msg agent"><strong>Fundora AI:</strong> Chat limpiado.</div>';
}

function downloadChat() {
  const chat = document.getElementById('chat-messages').innerText;
  const blob = new Blob([chat], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fundora-chat-' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
}

async function loadHistory() {
  const agente = document.getElementById('agente-select').value;
  try {
    const resp = await fetch('/memoria/' + agente + '?sessionId=dashboard-' + agente);
    const data = await resp.json();
    const mensajesDiv = document.getElementById('chat-messages');
    mensajesDiv.innerHTML = '<div class="msg agent"><strong>Fundora AI:</strong> Historial cargado.</div>';
    if (data.memoria) {
      data.memoria.forEach(item => {
        const div = document.createElement('div');
        div.className = 'msg ' + (item.tipo === 'chat' && item.contenido.startsWith('USUARIO:') ? 'user' : 'agent');
        const role = item.contenido.startsWith('USUARIO:') ? 'Tú' : agente;
        const text = item.contenido.replace(/^(USUARIO|AGENTE):\s*/, '');
        div.innerHTML = '<strong>' + role + ':</strong> ' + text;
        mensajesDiv.appendChild(div);
      });
    }
    mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
  } catch(e) {
    alert('Error al cargar historial');
  }
}

sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
