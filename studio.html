<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Viewport para que funcione bien en el teléfono -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FUNDORA AGENCY · Studio</title>

<!-- Fuentes: Space Grotesk (títulos, con carácter tech) + Inter (texto, legible) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   PALETA — "Atlántico premium"
   El azul océano es la base; el oro es la marca Fundora;
   el aqua marca lo que está vivo (agente activo).
   ═══════════════════════════════════════════════ */
:root {
  --oceano:        #0a1622;   /* fondo principal — Atlántico nocturno */
  --superficie:    #0f2030;   /* menú lateral y tarjetas */
  --superficie-alta:#16293b;  /* hover y elementos elevados */
  --borde:         #1e3348;   /* líneas divisorias sutiles */
  --oro:           #f0b429;   /* acento principal — marca Fundora */
  --aqua:          #2dd4bf;   /* acento vivo — Caribe, acciones activas */
  --texto:         #f4efe6;   /* texto principal (blanco cálido) */
  --texto-suave:   #8ba0b5;   /* texto secundario (gris azulado) */
  --usuario-burbuja:#173248;  /* fondo de tus mensajes */
  --ok:            #34d399;   /* verde de "hecho" en la traza */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--oceano);
  color: var(--texto);
  height: 100vh;
  overflow: hidden;
  display: flex;              /* menú lateral + área principal, lado a lado */
}

/* ═══════════════════════════════════════════════
   MENÚ LATERAL (conversaciones guardadas)
   ═══════════════════════════════════════════════ */
#sidebar {
  width: 280px;
  background: var(--superficie);
  border-right: 1px solid var(--borde);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.25s ease;
}

/* Logo / cabecera del menú */
.marca {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--borde);
}
.marca h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
/* El punto dorado del logo — pequeño detalle de marca */
.marca h1::before {
  content: "";
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--oro);
  box-shadow: 0 0 12px var(--oro);   /* brillo sutil, como una brújula */
}
.marca span { color: var(--texto-suave); font-weight: 500; font-size: 12px; letter-spacing: 2px; }

/* Botón "nueva conversación" */
.btn-nueva {
  margin: 14px;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--oro);
  color: var(--oro);
  border-radius: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s ease;
}
.btn-nueva:hover { background: var(--oro); color: var(--oceano); }

/* Lista de conversaciones (scroll) */
#lista-conversaciones {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px;
}
.conv-item {
  padding: 11px 12px;
  border-radius: 9px;
  cursor: pointer;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--texto-suave);
  font-size: 14px;
  transition: background 0.12s ease;
  position: relative;
}
.conv-item:hover { background: var(--superficie-alta); color: var(--texto); }
.conv-item.activa {
  background: var(--superficie-alta);
  color: var(--texto);
  /* Barra dorada a la izquierda de la conversación abierta */
  box-shadow: inset 3px 0 0 var(--oro);
}
.conv-item .titulo {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.conv-item .agente-tag {
  font-size: 10px;
  color: var(--aqua);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
/* Botón de borrar (aparece al pasar el mouse) */
.conv-item .borrar {
  opacity: 0;
  color: var(--texto-suave);
  font-size: 16px;
  transition: opacity 0.12s ease;
}
.conv-item:hover .borrar { opacity: 0.6; }
.conv-item .borrar:hover { opacity: 1; color: #f87171; }

/* Pie del menú */
.pie-menu {
  padding: 14px 18px;
  border-top: 1px solid var(--borde);
  font-size: 11px;
  color: var(--texto-suave);
}
.estado-conexion { display: flex; align-items: center; gap: 7px; }
.punto-estado { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.punto-estado.offline { background: #f87171; }

/* ═══════════════════════════════════════════════
   ÁREA PRINCIPAL (chat)
   ═══════════════════════════════════════════════ */
#principal {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Cabecera del chat: botón menú (móvil) + selector de agente */
.cabecera-chat {
  padding: 14px 20px;
  border-bottom: 1px solid var(--borde);
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--superficie);
}
.btn-menu {
  display: none;   /* solo visible en móvil */
  background: none;
  border: none;
  color: var(--texto);
  font-size: 22px;
  cursor: pointer;
}
.selector-agente {
  background: var(--oceano);
  color: var(--texto);
  border: 1px solid var(--borde);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  cursor: pointer;
}
.cabecera-chat .subtitulo {
  margin-left: auto;
  font-size: 12px;
  color: var(--texto-suave);
}

/* Zona de mensajes (scroll) */
#mensajes {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Pantalla de bienvenida (cuando no hay mensajes) */
.bienvenida {
  margin: auto;
  text-align: center;
  max-width: 440px;
  color: var(--texto-suave);
}
.bienvenida .icono {
  font-size: 48px;
  margin-bottom: 16px;
}
.bienvenida h2 {
  font-family: 'Space Grotesk', sans-serif;
  color: var(--texto);
  font-size: 24px;
  margin-bottom: 10px;
}
.bienvenida p { font-size: 15px; line-height: 1.6; }

/* Burbujas de mensaje */
.mensaje { display: flex; gap: 12px; max-width: 760px; }
.mensaje.usuario { align-self: flex-end; flex-direction: row-reverse; }
.avatar {
  width: 34px; height: 34px;
  border-radius: 9px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
}
.avatar.ia { background: linear-gradient(135deg, var(--oro), #d4941a); color: var(--oceano); }
.avatar.yo { background: var(--usuario-burbuja); color: var(--aqua); }
.burbuja {
  padding: 13px 16px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}
.mensaje.ia .burbuja { background: var(--superficie); border: 1px solid var(--borde); border-top-left-radius: 4px; }
.mensaje.usuario .burbuja { background: var(--usuario-burbuja); border-top-right-radius: 4px; }

/* ─── EL ELEMENTO ESTRELLA: rastro de trabajo del agente ─── */
/* Muestra las herramientas que el agente ejecutó, en vivo */
.rastro {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.paso {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  color: var(--texto-suave);
  background: var(--oceano);
  border: 1px solid var(--borde);
  border-radius: 8px;
  padding: 7px 11px;
}
.paso .icono-paso { font-size: 14px; }
.paso .check { margin-left: auto; color: var(--ok); font-weight: 600; }
.paso.trabajando .check { color: var(--aqua); }
/* Animación de "pensando" mientras el agente trabaja */
.pensando { display: flex; gap: 5px; padding: 6px 0; }
.pensando span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--aqua);
  animation: latido 1.2s infinite ease-in-out;
}
.pensando span:nth-child(2) { animation-delay: 0.15s; }
.pensando span:nth-child(3) { animation-delay: 0.3s; }
@keyframes latido { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }

/* Multimedia generada (imágenes, audio) dentro del chat */
.artefacto { margin-top: 10px; }
.artefacto img { max-width: 320px; border-radius: 10px; border: 1px solid var(--borde); }
.artefacto audio { width: 280px; margin-top: 6px; }
.artefacto .chip-archivo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--oceano);
  border: 1px solid var(--borde);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--aqua);
}

/* Zona de escritura */
.zona-input {
  padding: 16px 20px 20px;
  border-top: 1px solid var(--borde);
  background: var(--superficie);
}
.caja-input {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--oceano);
  border: 1px solid var(--borde);
  border-radius: 14px;
  padding: 8px 8px 8px 16px;
  max-width: 800px;
  margin: 0 auto;
}
.caja-input:focus-within { border-color: var(--oro); }
#entrada {
  flex: 1;
  background: none;
  border: none;
  color: var(--texto);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  resize: none;
  max-height: 140px;
  outline: none;
  padding: 8px 0;
  line-height: 1.5;
}
#entrada::placeholder { color: var(--texto-suave); }
.btn-enviar {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--oro);
  color: var(--oceano);
  border: none;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s ease;
}
.btn-enviar:hover { transform: scale(1.05); }
.btn-enviar:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ═══════════════════════════════════════════════
   RESPONSIVE — en el teléfono el menú se oculta
   ═══════════════════════════════════════════════ */
.velo { display: none; }
@media (max-width: 720px) {
  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 20;
    transform: translateX(-100%);   /* oculto por defecto */
  }
  #sidebar.abierto { transform: translateX(0); }
  .btn-menu { display: block; }
  .velo.visible {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 15;
  }
  .mensaje { max-width: 100%; }
}

/* Scrollbars discretas */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--borde); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<!-- ═══ MENÚ LATERAL ═══ -->
<aside id="sidebar">
  <div class="marca">
    <h1>FUNDORA</h1>
    <span>AGENCY · STUDIO</span>
  </div>
  <button class="btn-nueva" onclick="nuevaConversacion()">
    <span style="font-size:18px;">＋</span> Nueva conversación
  </button>
  <div id="lista-conversaciones"><!-- se llena con JS --></div>
  <div class="pie-menu">
    <div class="estado-conexion">
      <span class="punto-estado" id="punto-estado"></span>
      <span id="texto-estado">Conectando…</span>
    </div>
  </div>
</aside>

<!-- Velo oscuro detrás del menú en móvil -->
<div class="velo" id="velo" onclick="cerrarMenu()"></div>

<!-- ═══ ÁREA PRINCIPAL (CHAT) ═══ -->
<main id="principal">
  <div class="cabecera-chat">
    <button class="btn-menu" onclick="abrirMenu()">☰</button>
    <select class="selector-agente" id="selector-agente">
      <option value="general">🧭 General (orquestador)</option>
      <option value="ceo">👔 CEO Fundora Prime</option>
      <option value="programador">💻 Programador</option>
      <option value="director">🎨 Director creativo</option>
      <option value="financiero">💰 Financiero</option>
      <option value="marketing">📣 Marketing</option>
      <option value="abogado">⚖️ Abogado</option>
      <option value="analista">📊 Analista deportivo</option>
    </select>
    <span class="subtitulo" id="subtitulo-agente">Pide cualquier cosa — el agente ejecuta</span>
  </div>

  <div id="mensajes">
    <!-- Pantalla de bienvenida inicial -->
    <div class="bienvenida" id="bienvenida">
      <div class="icono">🧭</div>
      <h2>¿En qué trabajamos hoy?</h2>
      <p>Escribe lo que necesites en lenguaje natural. El agente razona, elige sus herramientas y ejecuta la tarea — genera imágenes, escribe código, crea documentos y más.</p>
    </div>
  </div>

  <div class="zona-input">
    <div class="caja-input">
      <textarea id="entrada" rows="1" placeholder="Escribe tu mensaje…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar();}"
        oninput="autoCrecer(this)"></textarea>
      <button class="btn-enviar" id="btn-enviar" onclick="enviar()">➤</button>
    </div>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════
   CONFIGURACIÓN
   API_BASE vacío = rutas relativas. Cuando el propio backend
   sirve esta página, los fetch van solos al servidor correcto.
   ═══════════════════════════════════════════════ */
const API_BASE = "";           // '' = mismo servidor que sirve esta página
const USUARIO = "yoel";        // dueño (luego será la API key de cada cliente)

let conversacionActual = null; // id de la conversación abierta
let enviando = false;

/* ─── Arranque: cargar conversaciones y probar conexión ─── */
async function iniciar() {
  await cargarConversaciones();
}

/* ─── Cargar la lista del menú lateral ─── */
async function cargarConversaciones() {
  try {
    const resp = await fetch(`${API_BASE}/conversaciones?usuario=${USUARIO}`);
    const lista = await resp.json();
    marcarConexion(true);
    pintarLista(Array.isArray(lista) ? lista : []);
  } catch (e) {
    // Sin backend (ej. vista previa): mostramos ejemplos para ver el diseño
    marcarConexion(false);
    pintarLista(CONVERSACIONES_DEMO);
  }
}

/* ─── Pintar la lista de conversaciones ─── */
function pintarLista(lista) {
  const cont = document.getElementById("lista-conversaciones");
  if (!lista.length) {
    cont.innerHTML = `<p style="color:var(--texto-suave);font-size:13px;padding:14px;text-align:center;">Aún no hay conversaciones.<br>Crea la primera arriba.</p>`;
    return;
  }
  cont.innerHTML = lista.map(c => `
    <div class="conv-item ${c.id === conversacionActual ? 'activa' : ''}" onclick="abrirConversacion('${c.id}')">
      <div style="flex:1;min-width:0;">
        <div class="titulo">${escapar(c.titulo || 'Sin título')}</div>
        <div class="agente-tag">${escapar(c.agente || 'general')}</div>
      </div>
      <span class="borrar" onclick="event.stopPropagation();borrar('${c.id}')">🗑</span>
    </div>
  `).join("");
}

/* ─── Abrir una conversación y cargar sus mensajes ─── */
async function abrirConversacion(id) {
  conversacionActual = id;
  cerrarMenu();
  try {
    const resp = await fetch(`${API_BASE}/conversaciones/${id}`);
    const data = await resp.json();
    pintarMensajes(data.mensajes || []);
  } catch (e) {
    pintarMensajes(MENSAJES_DEMO);   // demo si no hay backend
  }
  cargarConversaciones(); // refrescar para resaltar la activa
}

/* ─── Botón "nueva conversación" ─── */
function nuevaConversacion() {
  conversacionActual = null;
  document.getElementById("mensajes").innerHTML = `
    <div class="bienvenida">
      <div class="icono">🧭</div>
      <h2>Nueva conversación</h2>
      <p>Escribe tu primer mensaje y el agente se pone a trabajar.</p>
    </div>`;
  cerrarMenu();
  cargarConversaciones();
}

/* ─── Enviar un mensaje al agente (motor de herramientas) ─── */
async function enviar() {
  const entrada = document.getElementById("entrada");
  const texto = entrada.value.trim();
  if (!texto || enviando) return;

  enviando = true;
  document.getElementById("btn-enviar").disabled = true;
  entrada.value = "";
  autoCrecer(entrada);

  quitarBienvenida();
  agregarMensaje("usuario", texto);          // pinta tu mensaje
  const indicador = agregarPensando();       // pinta "trabajando…"

  const agente = document.getElementById("selector-agente").value;

  try {
    const resp = await fetch(`${API_BASE}/agente`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje: texto, agente, conversacion_id: conversacionActual, usuario: USUARIO })
    });
    const data = await resp.json();
    indicador.remove();

    // Guardar el id si era conversación nueva
    if (data.conversacion_id) conversacionActual = data.conversacion_id;

    agregarMensaje("ia", data.respuesta || "Listo.", data.pasos, data.artefactos);
    cargarConversaciones();   // refrescar el menú lateral
  } catch (e) {
    indicador.remove();
    // Demo: si no hay backend, mostramos una respuesta de ejemplo con rastro
    agregarMensaje("ia", "Esta es una vista previa del diseño. Cuando el Studio corra en tu servidor, aquí verás la respuesta real del agente con su rastro de trabajo.", RASTRO_DEMO, null);
  }

  enviando = false;
  document.getElementById("btn-enviar").disabled = false;
}

/* ─── Pintar un mensaje en el chat ─── */
function agregarMensaje(tipo, texto, pasos, artefactos) {
  const cont = document.getElementById("mensajes");
  const div = document.createElement("div");
  div.className = `mensaje ${tipo}`;

  const avatar = tipo === "usuario"
    ? `<div class="avatar yo">TÚ</div>`
    : `<div class="avatar ia">F</div>`;

  let extra = "";
  // Rastro de herramientas (el elemento estrella)
  if (pasos && pasos.length) {
    extra += `<div class="rastro">` + pasos.map(p => `
      <div class="paso">
        <span class="icono-paso">${iconoHerramienta(p.herramienta)}</span>
        <span>${nombreHerramienta(p.herramienta)}</span>
        <span class="check">${p.ok === false ? '✕' : '✓'}</span>
      </div>`).join("") + `</div>`;
  }
  // Multimedia generada
  if (artefactos && artefactos.length) {
    extra += `<div class="artefacto">` + artefactos.map(a => renderArtefacto(a)).join("") + `</div>`;
  }

  div.innerHTML = `${avatar}<div><div class="burbuja">${escapar(texto)}</div>${extra}</div>`;
  cont.appendChild(div);
  cont.scrollTop = cont.scrollHeight;
}

/* ─── Indicador "el agente está trabajando" ─── */
function agregarPensando() {
  const cont = document.getElementById("mensajes");
  const div = document.createElement("div");
  div.className = "mensaje ia";
  div.innerHTML = `<div class="avatar ia">F</div><div class="burbuja"><div class="pensando"><span></span><span></span><span></span></div></div>`;
  cont.appendChild(div);
  cont.scrollTop = cont.scrollHeight;
  return div;
}

/* ─── Renderizar imagen / audio / pdf ─── */
function renderArtefacto(a) {
  if (a.tipo === "imagen" && a.imagen) return `<img src="${a.imagen}" alt="imagen generada">`;
  if (a.tipo === "audio" && a.audio)   return `<audio controls src="${a.audio}"></audio>`;
  if (a.tipo === "pdf")   return `<div class="chip-archivo">📄 Documento PDF generado</div>`;
  if (a.tipo === "imagen") return `<div class="chip-archivo">🎨 Imagen generada</div>`;
  if (a.tipo === "audio")  return `<div class="chip-archivo">🔊 Audio generado</div>`;
  return `<div class="chip-archivo">📦 ${escapar(a.tipo || 'archivo')}</div>`;
}

/* ─── Borrar una conversación ─── */
async function borrar(id) {
  if (!confirm("¿Borrar esta conversación?")) return;
  try { await fetch(`${API_BASE}/conversaciones/${id}`, { method: "DELETE" }); } catch(e) {}
  if (id === conversacionActual) nuevaConversacion();
  cargarConversaciones();
}

/* ─── Pintar mensajes de una conversación cargada ─── */
function pintarMensajes(mensajes) {
  document.getElementById("mensajes").innerHTML = "";
  if (!mensajes.length) { quitarBienvenida(); return; }
  mensajes.forEach(m => {
    agregarMensaje(m.rol === "user" ? "usuario" : "ia", m.contenido || "", m.pasos, m.artefactos);
  });
}

/* ─── Utilidades ─── */
function iconoHerramienta(h) {

function escapar(t) { const d = document.createElement("div"); d.textContent = t || ""; return d.innerHTML; }
function quitarBienvenida() { const b = document.getElementById("bienvenida"); if (b) b.remove(); }
function autoCrecer(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 140) + "px"; }
function marcarConexion(ok) {
  document.getElementById("punto-estado").className = "punto-estado" + (ok ? "" : " offline");
  document.getElementById("texto-estado").textContent = ok ? "Conectado" : "Vista previa (sin servidor)";
}
/* Menú móvil */
function abrirMenu() { document.getElementById("sidebar").classList.add("abierto"); document.getElementById("velo").classList.add("visible"); }
function cerrarMenu() { document.getElementById("sidebar").classList.remove("abierto"); document.getElementById("velo").classList.remove("visible"); }
